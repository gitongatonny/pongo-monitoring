name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: '1.3.5'
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run tsc --noEmit
      - run: bun run test

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:install
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: Build and scan image
    needs: [quality, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    env:
      LOCAL_IMAGE: pongo-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check main release eligibility
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          current=$(jq -er '.version' release.json)
          [[ "$current" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          previous=$(git show "$PREVIOUS_SHA:release.json" 2>/dev/null || true)
          if [[ -n "$previous" ]] && [[ "$current" == "$(jq -er '.version' <<< "$previous")" ]]; then
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)'
          echo "version=$current" >> "$GITHUB_OUTPUT"
      - name: Build container image
        env:
          PUBLIC_URL: ${{ vars.PONGO_PUBLIC_URL }}
        run: |
          docker build --tag "$LOCAL_IMAGE" --build-arg "PONGO_BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg "NEXT_PUBLIC_URL=$PUBLIC_URL" .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.LOCAL_IMAGE }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Save scanned image
        if: steps.release.outputs.version != ''
        run: docker save "$LOCAL_IMAGE" --output "$RUNNER_TEMP/pongo-image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release.outputs.version != ''
        with:
          name: pongo-image
          path: ${{ runner.temp }}/pongo-image.tar
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish scanned image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.outputs.release_version != ''
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pongo-image
          path: ${{ runner.temp }}
      - name: Publish to GHCR and record digest
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.image.outputs.release_version }}
        run: |
          docker load --input "$RUNNER_TEMP/pongo-image.tar"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          local_image="pongo-ci:$GITHUB_SHA"
          release_image="$repository:$RELEASE_VERSION"
          sha_image="$repository:sha-$GITHUB_SHA"
          docker tag "$local_image" "$sha_image"
          docker push "$sha_image"
          if docker buildx imagetools inspect "$release_image" > "$RUNNER_TEMP/tag-check" 2>&1; then
            echo "::error::Release tag $RELEASE_VERSION already exists"
            exit 1
          fi
          if ! grep -qiE 'manifest unknown|not found' "$RUNNER_TEMP/tag-check"; then
            cat "$RUNNER_TEMP/tag-check"
            exit 1
          fi
          docker tag "$local_image" "$release_image"
          docker push "$release_image"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$release_image")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"
          printf 'Published `%s` as `%s@%s`\n' "$release_image" "$repository" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Request and verify local K3s deployment
    needs: [image, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      deployments: write
    steps:
      - name: Queue deployment for the local K3s watcher
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
          RELEASE_VERSION: ${{ needs.image.outputs.release_version }}
        run: |
          request=$(jq -n --arg ref "$GITHUB_SHA" --arg image "$DEPLOY_IMAGE" \
            --arg version "$RELEASE_VERSION" --arg run "$GITHUB_RUN_ID" \
            '{ref: $ref, task: "deploy:k3s", environment: "foemi-local", auto_merge: false,
              required_contexts: [], payload: {image: $image, version: $version, run: $run}}')
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id <<< "$request")
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=queued -f description='Waiting for the local K3s watcher' \
            -F auto_inactive=false >/dev/null
      - name: Wait for the verified rollout
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.request.outputs.id }}
        run: |
          for attempt in {1..90}; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --jq '.[0].state')
            case "$status" in
              success) exit 0 ;;
              failure|error) exit 1 ;;
            esac
            sleep 10
          done
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=error -f description='Local rollout verification timed out' >/dev/null
          exit 1
      - name: Record deployment result
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.image.outputs.release_version }}
          DEPLOYMENT_ID: ${{ steps.request.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          printf 'Local K3s deployment %s for `%s` finished with status **%s**.\n' \
            "$DEPLOYMENT_ID" "$RELEASE_VERSION" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
