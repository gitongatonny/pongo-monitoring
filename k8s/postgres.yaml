apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pongo
spec:
  clusterIP: None
  selector:
    app: pongo-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pongo
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app: pongo-postgres
  template:
    metadata:
      labels:
        app: pongo-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pongo
            - name: POSTGRES_USER
              value: pongo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pongo-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, pongo, -d, pongo]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
