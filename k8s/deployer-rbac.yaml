apiVersion: v1
kind: ServiceAccount
metadata:
  name: pongo-deployer
  namespace: pongo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pongo-deployer
  namespace: pongo
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pongo-deployer
  namespace: pongo
subjects:
  - kind: ServiceAccount
    name: pongo-deployer
    namespace: pongo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pongo-deployer
