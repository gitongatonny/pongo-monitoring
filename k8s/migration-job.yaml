apiVersion: batch/v1
kind: Job
metadata:
  name: pongo-migrate-release
  namespace: pongo
spec:
  ttlSecondsAfterFinished: 604800
  activeDeadlineSeconds: 180
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: pongo-ghcr
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: pongo-app:release
          imagePullPolicy: IfNotPresent
          command: [bun, scripts/migrate-postgres.ts]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pongo-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
