apiVersion: v1
kind: Secret
metadata:
  name: pongo-secrets
  namespace: pongo
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-random-hex
  DATABASE_URL: postgres://pongo:replace-with-random-hex@postgres:5432/pongo
  ACCESS_CODE: replace-with-a-generated-access-code
  SESSION_SECRET: replace-with-a-random-secret-at-least-32-characters-long
  SCHEDULER_SECRET: replace-with-a-generated-scheduler-secret
