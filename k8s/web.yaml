apiVersion: v1
kind: Service
metadata:
  name: pongo-web
spec:
  selector:
    app: pongo-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pongo-web
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pongo-web
  template:
    metadata:
      labels:
        app: pongo-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: pongo-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: pongo-app:release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: pongo-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pongo-secrets
                  key: DATABASE_URL
            - name: ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: pongo-secrets
                  key: ACCESS_CODE
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pongo-secrets
                  key: SESSION_SECRET
            - name: SCHEDULER_SECRET
              valueFrom:
                secretKeyRef:
                  name: pongo-secrets
                  key: SCHEDULER_SECRET
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
